<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARAVI-ASSISTANT — Control Center & Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app-window">
    <main class="main-content limits-content">
      <header class="panel-header">
        <h1>Website time limits</h1>
        <p>YouTube and Instagram</p>
      </header>

      <form id="limits-form">
        <section class="section-card limit-list" aria-label="Website time limits">
          <div class="limit-row">
            <label for="youtube-limit">
              <strong>YouTube</strong>
              <span>youtube.com</span>
            </label>
            <div class="limit-control">
              <input id="youtube-limit" name="youtube" type="number" min="1" max="300" value="30" required>
              <span>minutes</span>
            </div>
          </div>
          <div class="limit-row">
            <label for="instagram-limit">
              <strong>Instagram</strong>
              <span>instagram.com</span>
            </label>
            <div class="limit-control">
              <input id="instagram-limit" name="instagram" type="number" min="1" max="300" value="20" required>
              <span>minutes</span>
            </div>
          </div>
        </section>
        <div class="save-row">
          <p id="save-status" role="status" aria-live="polite"></p>
          <button class="primary-btn" type="submit">Save limits</button>
        </div>
      </form>

      <section class="section-card observation-card" aria-labelledby="observation-title">
        <h2 id="observation-title">App activity observation</h2>
        <p>When enabled, ARAVI shows the active window title. Titles stay on this device and are not saved. No screenshots are captured. Website time-limit tracking runs independently.</p>
        <div class="observation-controls">
          <p id="observation-status" role="status" aria-live="polite">Observation is off.</p>
          <button class="secondary-btn" id="observation-toggle" type="button">Start observing</button>
        </div>
      </section>
    </main>
  </div>

  <script src="settings.js"></script>
</body>
</html>
